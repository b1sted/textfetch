name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test, leak, lint & ARM IDs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format-18 clang-tidy cppcheck
          sudo apt-get install -y --no-install-recommends xxd \
            || sudo apt-get install -y --no-install-recommends vim-common

      - name: Validate ARM ID database
        run: make validate-ids

      - name: Check generated ARM ID header
        run: make arm-ids-check CLANG_FORMAT=clang-format-18

      - name: Run test suite
        run: make test

      - name: Check for memory leaks
        run: |
          make leaks
          ./bin/textfetch-leaks

      - name: Run linters
        run: make lint CLANG_FORMAT=clang-format-18

  build-linux-amd64:
    name: Build (linux-amd64)
    needs: test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build release binary
        run: make VERSION="${GITHUB_REF_NAME#v}"

      - name: Smoke test
        run: ./bin/textfetch -V

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/textfetch artifact/textfetch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: textfetch-linux-amd64
          path: artifact/
          if-no-files-found: error

  build-linux-arm64:
    name: Build (linux-arm64)
    needs: test
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build release binary
        run: make VERSION="${GITHUB_REF_NAME#v}"

      - name: Smoke test
        run: ./bin/textfetch -V

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/textfetch artifact/textfetch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: textfetch-linux-arm64
          path: artifact/
          if-no-files-found: error

  build-linux-armv7:
    name: Build (linux-armv7)
    needs: test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user

      - name: Build release binary
        run: >-
          make CC=arm-linux-gnueabihf-gcc
          VERSION="${GITHUB_REF_NAME#v}"

      - name: Smoke test under QEMU
        run: >-
          QEMU_LD_PREFIX=/usr/arm-linux-gnueabihf
          qemu-arm ./bin/textfetch -V

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/textfetch artifact/textfetch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: textfetch-linux-armv7
          path: artifact/
          if-no-files-found: error

  build-linux-riscv64:
    name: Build (linux-riscv64)
    needs: test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user

      - name: Build release binary
        run: >-
          make CC=riscv64-linux-gnu-gcc
          VERSION="${GITHUB_REF_NAME#v}"

      - name: Smoke test under QEMU
        run: >-
          QEMU_LD_PREFIX=/usr/riscv64-linux-gnu
          qemu-riscv64 ./bin/textfetch -V

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/textfetch artifact/textfetch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: textfetch-linux-riscv64
          path: artifact/
          if-no-files-found: error

  build-linux-luckfox:
    name: Build (linux-luckfox)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Fetch Luckfox toolchain
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/LuckfoxTECH/luckfox-pico.git "$RUNNER_TEMP/luckfox-sdk"
          git -C "$RUNNER_TEMP/luckfox-sdk" sparse-checkout set \
            tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf
          test -x \
            "$RUNNER_TEMP/luckfox-sdk/tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf/bin/arm-rockchip830-linux-uclibcgnueabihf-gcc"

      - name: Build release binary
        run: |
          TOOLCHAIN="$RUNNER_TEMP/luckfox-sdk/tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf/bin"
          make CC="$TOOLCHAIN/arm-rockchip830-linux-uclibcgnueabihf-gcc" \
            VERSION="${GITHUB_REF_NAME#v}"
          file bin/textfetch

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/textfetch artifact/textfetch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: textfetch-linux-luckfox
          path: artifact/
          if-no-files-found: error

  build-android-termux:
    name: Build (android-termux-${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
            os: ubuntu-24.04-arm
            image: termux/termux-docker:aarch64
            platform: linux/arm64
          - name: arm7a
            os: ubuntu-latest
            image: termux/termux-docker:arm
            platform: linux/arm/v7
          - name: x86_64
            os: ubuntu-latest
            image: termux/termux-docker:x86_64
            platform: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup QEMU
        if: matrix.name == 'arm7a'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Build, smoke test, and package in Termux
        run: |
          chmod -R a+rwX .
          docker run --rm \
            --platform ${{ matrix.platform }} \
            --security-opt seccomp:unconfined \
            -v "$PWD:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            /entrypoint.sh bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y clang make
              VERSION="${1#v}"
              make CC=clang VERSION="$VERSION"
              ./bin/textfetch -V
              ARCH="$(dpkg --print-architecture)"
              PKG="textfetch_${VERSION}_${ARCH}.deb"
              PKGROOT="pkgroot"
              mkdir -p "$PKGROOT/DEBIAN" "$PKGROOT/data/data/com.termux/files/usr/bin"
              cp bin/textfetch "$PKGROOT/data/data/com.termux/files/usr/bin/textfetch"
              chmod 0755 "$PKGROOT/data/data/com.termux/files/usr/bin/textfetch"
              printf "%s\n" \
                "Package: textfetch" \
                "Version: $VERSION" \
                "Architecture: $ARCH" \
                "Maintainer: Nikita Mandrykin <pkg@basted.dev>" \
                "Homepage: https://github.com/b1sted/textfetch" \
                "Section: utils" \
                "Priority: optional" \
                "Description: A minimal, fast system information tool for UNIX systems with no third-party dependencies." \
                > "$PKGROOT/DEBIAN/control"
              dpkg-deb --root-owner-group --build "$PKGROOT" "$PKG"
              dpkg -i "$PKG"
              textfetch -V
              mkdir -p artifact
              cp "$PKG" artifact/
              cp bin/textfetch artifact/textfetch
              chmod -R a+rwX artifact
            ' _ "${GITHUB_REF_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: textfetch-android-termux-${{ matrix.name }}
          path: artifact/
          if-no-files-found: error

  build-macos-intel:
    name: Build (macos-intel)
    needs: test
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download macOS 10.11 SDK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/SDKs"
          curl -fsSL https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.11.sdk.tar.xz \
            | tar -xJ -C "$GITHUB_WORKSPACE/SDKs"

      - name: Build legacy binary
        run: |
          SDKROOT="$GITHUB_WORKSPACE/SDKs/MacOSX10.11.sdk"
          make \
            CFLAGS="-target x86_64-apple-macos10.7 -isysroot $SDKROOT" \
            LDFLAGS="-target x86_64-apple-macos10.7 -isysroot $SDKROOT -Wl,-ld_classic -Wl,-no_new_main" \
            TARGET=bin/textfetch-legacy \
            VERSION="${GITHUB_REF_NAME#v}"
          ./bin/textfetch-legacy -V

      - name: Build modern binary
        run: |
          SDKROOT="$GITHUB_WORKSPACE/SDKs/MacOSX10.11.sdk"
          rm -rf obj
          make \
            CFLAGS="-target x86_64-apple-macos10.9 -isysroot $SDKROOT" \
            LDFLAGS="-target x86_64-apple-macos10.9 -isysroot $SDKROOT" \
            VERSION="${GITHUB_REF_NAME#v}"
          ./bin/textfetch -V

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/textfetch artifact/textfetch
          cp bin/textfetch-legacy artifact/textfetch-legacy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: textfetch-macos-intel
          path: artifact/
          if-no-files-found: error

  build-macos-arm64:
    name: Build (macos-arm64)
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build release binary
        run: |
          make \
            CFLAGS="-target arm64-apple-macos11" \
            LDFLAGS="-target arm64-apple-macos11" \
            VERSION="${GITHUB_REF_NAME#v}"
          ./bin/textfetch -V

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/textfetch artifact/textfetch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: textfetch-macos-arm64
          path: artifact/
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - test
      - build-linux-amd64
      - build-linux-arm64
      - build-linux-armv7
      - build-linux-riscv64
      - build-linux-luckfox
      - build-android-termux
      - build-macos-intel
      - build-macos-arm64
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_sha256: ${{ steps.source.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Set release version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute source archive checksum
        id: source
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL --retry 5 --retry-delay 2 \
            -o /tmp/textfetch-source.tar.gz \
            "https://github.com/b1sted/textfetch/archive/refs/tags/v${VERSION}.tar.gz"
          echo "sha256=$(sha256sum /tmp/textfetch-source.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Build release archives
        run: |
          set -euo pipefail
          mkdir -p release_dist staging

          pack() {
            local src="$1"
            local name="$2"
            local dir="staging/$name"
            mkdir -p "$dir"
            cp "$src" "$dir/textfetch"
            chmod 0755 "$dir/textfetch"
            tar -C "$dir" -czf "release_dist/textfetch-$name.tar.gz" textfetch
          }

          pack artifacts/textfetch-linux-amd64/textfetch linux-amd64
          pack artifacts/textfetch-linux-arm64/textfetch linux-arm64
          pack artifacts/textfetch-linux-armv7/textfetch linux-armv7
          pack artifacts/textfetch-linux-riscv64/textfetch linux-riscv64
          pack artifacts/textfetch-linux-luckfox/textfetch linux-luckfox
          pack artifacts/textfetch-macos-arm64/textfetch macos-arm64
          pack artifacts/textfetch-macos-intel/textfetch-legacy macos-intel-legacy
          pack artifacts/textfetch-macos-intel/textfetch macos-intel-modern
          pack artifacts/textfetch-android-termux-aarch64/textfetch android-termux-aarch64
          pack artifacts/textfetch-android-termux-arm7a/textfetch android-termux-arm7a
          pack artifacts/textfetch-android-termux-x86_64/textfetch android-termux-x86_64

      - name: Install nfpm
        run: |
          set -euo pipefail
          NFPM_VERSION="2.49.0"
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          rm -f /tmp/nfpm.tar.gz /tmp/nfpm
          nfpm --version

      - name: Build Linux packages
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p nfpm_staging
          for pair in linux-amd64:amd64 linux-arm64:arm64 linux-armv7:arm7 linux-riscv64:riscv64; do
            name="${pair%%:*}"
            arch="${pair##*:}"
            cp "artifacts/textfetch-$name/textfetch" nfpm_staging/textfetch
            chmod 0755 nfpm_staging/textfetch
            for packager in deb rpm archlinux; do
              NFPM_ARCH="$arch" VERSION="$VERSION" \
                nfpm package -f nfpm.yaml -p "$packager" -t release_dist/
            done
          done

      - name: Add Termux packages
        run: cp artifacts/textfetch-android-termux-*/*.deb release_dist/

      - name: Generate checksums
        run: |
          (cd release_dist && sha256sum * > /tmp/SHA256SUMS.txt) && mv /tmp/SHA256SUMS.txt release_dist/SHA256SUMS.txt

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: "0DDA70A6A02167984707F0F7A8DE7BE6803A4BE2"

      - name: Sign checksums
        run: |
          gpg --batch --yes --armor --detach-sign --local-user '0DDA70A6A02167984707F0F7A8DE7BE6803A4BE2!' --output release_dist/SHA256SUMS.txt.asc release_dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release_dist/*'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  update-homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    environment: homebrew
    permissions:
      contents: read

    steps:
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: "0DDA70A6A02167984707F0F7A8DE7BE6803A4BE2"
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true

      - name: Update formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SOURCE_SHA256: ${{ needs.release.outputs.source_sha256 }}
        run: |
          set -euo pipefail

          UID_LINE="$(gpg --list-secret-keys --with-colons | awk -F: '/^uid:/ {print $10; exit}')"
          GPG_NAME="${UID_LINE%% <*}"
          GPG_EMAIL="$(printf '%s\n' "$UID_LINE" | sed -n 's/.*<\([^>]*\)>.*/\1/p')"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/b1sted/homebrew-tap.git" tap
          cd tap
          git config user.name "$GPG_NAME"
          git config user.email "$GPG_EMAIL"
          git config commit.gpgsign true

          mkdir -p Formula
          cat > Formula/textfetch.rb <<EOF
          class Textfetch < Formula
            desc "Minimal, fast system information tool for UNIX systems"
            homepage "https://github.com/b1sted/textfetch"
            url "https://github.com/b1sted/textfetch/archive/refs/tags/v${VERSION}.tar.gz"
            sha256 "${SOURCE_SHA256}"
            license "MIT"

            def install
              system "make", "VERSION=#{version}"
              bin.install "bin/textfetch"
            end

            test do
              assert_match "textfetch v#{version}", shell_output("#{bin}/textfetch -V")

              output = shell_output("#{bin}/textfetch")
              assert_match "OS: ", output
              assert_match "Kernel: ", output
            end
          end
          EOF

          git add Formula/textfetch.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date"
            exit 0
          fi

          git commit -S -m "textfetch ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
