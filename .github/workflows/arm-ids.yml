name: ARM IDs

on:
  pull_request:
    paths:
      - 'data/arm.ids'
      - 'include/arm_ids.h'
      - 'scripts/generate_arm_ids.sh'
      - 'scripts/validate_arm_ids.sh'
      - 'scripts/update_arm_ids.sh'
      - '.github/workflows/arm-ids.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'data/arm.ids'
      - 'include/arm_ids.h'
      - 'scripts/generate_arm_ids.sh'
      - 'scripts/validate_arm_ids.sh'
      - 'scripts/update_arm_ids.sh'
      - '.github/workflows/arm-ids.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ARM IDs
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
          sudo apt-get install -y --no-install-recommends xxd \
            || sudo apt-get install -y --no-install-recommends vim-common

      - name: Validate database
        run: make validate-ids

      - name: Check generated header
        run: make arm-ids-check CLANG_FORMAT=clang-format-18

