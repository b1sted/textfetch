# yaml-language-server: $schema=https://nfpm.goreleaser.com/static/schema.json
name: "textfetch"
arch: "${NFPM_ARCH}"
platform: "linux"
version: "${VERSION}"
version_schema: "semver"
section: "utils"
priority: "optional"
maintainer: "Nikita Mandrykin <pkg@basted.dev>"
description: |-
  A minimal, fast system information tool for UNIX systems with no third-party dependencies.
homepage: "https://github.com/b1sted/textfetch"
license: "MIT"
contents:
  - src: "./nfpm_staging/textfetch"
    dst: "/usr/bin/textfetch"
    file_info:
      mode: 0755
